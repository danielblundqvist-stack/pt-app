<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PT-app v3</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:system-ui;margin:0;background:#f4f4f5}
.page{max-width:1100px;margin:auto;padding:16px}
.card{background:white;border-radius:16px;padding:12px;margin-bottom:12px}
.btn{border:1px solid #ccc;padding:8px;border-radius:8px;cursor:pointer}
input{width:100%;padding:8px;margin-top:6px}
</style>
</head>

<body>
<div class="page">

<h2>Din PT-app v3</h2>

<div class="card">
<h3>Check-in</h3>
<input id="weight" placeholder="Vikt">
<input id="waist" placeholder="Midja">
<input id="energy" placeholder="Energi">
<button class="btn" onclick="saveCheckin()">Spara</button>
</div>

<div class="card">
<h3>Push</h3>
<div>Bänkpress</div>
<div>Lutande hantelpress</div>
<div>Axelpress</div>
<div>Triceps</div>
<div>Planka</div>
</div>

<div class="card">
<h3>Pull</h3>
<div>Rodd</div>
<div>Omvända flyes</div>
<div>Biceps</div>
<div>Sidoplanka</div>
</div>

<div class="card">
<h3>Historik</h3>
<div id="history"></div>
</div>

<div class="card">
<h3>Vikt</h3>
<canvas id="weightChart"></canvas>
</div>

<div class="card">
<h3>Midja</h3>
<canvas id="waistChart"></canvas>
</div>

</div>

<script>

function saveCheckin(){
  const entry = {
    date: new Date().toISOString().slice(0,10),
    weight: document.getElementById("weight").value,
    waist: document.getElementById("waist").value,
    energy: document.getElementById("energy").value
  }

  let history = JSON.parse(localStorage.getItem("history") || "[]")
  history.unshift(entry)
  localStorage.setItem("history", JSON.stringify(history))

  render()
}

function render(){
  let history = JSON.parse(localStorage.getItem("history") || "[]")

  document.getElementById("history").innerHTML =
    history.map(h => `${h.date} – ${h.weight}kg / ${h.waist}cm`).join("<br>")

  const weights = history.map(h => Number(h.weight)).reverse()
  const waists = history.map(h => Number(h.waist)).reverse()
  const labels = history.map(h => h.date).reverse()

  new Chart(document.getElementById("weightChart"), {
    type: "line",
    data: {labels, datasets: [{label:"Vikt", data: weights}]}
  })

  new Chart(document.getElementById("waistChart"), {
    type: "line",
    data: {labels, datasets: [{label:"Midja", data: waists}]}
  })
}

render()

</script>
</body>
</html>
